server:
  url: https://vaultls.example.com
  client_id: svc_xxxxxxxx
  secret: ${VAULTLS_SECRET}
  insecure_skip_verify: false
schedule: "0 3 1 * *"
jitter: 30m
# Logging. Defaults: level=info, format=text, output=stderr (captured by journald).
# Set file to also keep a log under /var/log; use level=debug for verbose output.
log:
  level: info          # debug|info|warn|error
  format: text         # text|json
  # file: /var/log/vaultls-agent.log
exporter:
  listen: "127.0.0.1:9105"
# Publish the VaulTLS root CAs into the host's system trust store, so any local
# client (curl, psql, openssl) accepts certificates issued by VaulTLS.
# OFF by default: enabling it changes trust for the WHOLE host.
# anchor_dir/update_command are detected automatically (Debian and RHEL layouts);
# set them explicitly on any other system.
# ca_trust:
#   enabled: true
#   anchor_dir: /usr/local/share/ca-certificates
#   update_command: "update-ca-certificates"
domains:
  - name: "*.example.com"
    # out_dir must live under /etc/ssl/vaultls (the unit's ReadWritePaths).
    # To write elsewhere, extend ReadWritePaths via a systemd override.
    out_dir: /etc/ssl/vaultls/example.com
    # Optional: rename the output files. basename: example writes example.crt
    # (fullchain), example-cert.crt, example-chain.crt, example-key.key and
    # example-haproxy.pem. Unset keeps fullchain.crt/cert.crt/chain.crt/privkey.key.
    # basename: example
    formats: [nginx, haproxy]
    owner: root
    group: ssl-cert
    mode: "0640"
    reload: "systemctl reload nginx"
  # A domain can instead keep a Kubernetes Secret up to date. Mixing both target
  # kinds in one config is fine; the k8s target needs a service account with
  # get/create/update/patch on the named Secret, so it is normally deployed with
  # the helm-chart-agent chart rather than as a .deb on a node.
  # - name: "*.example.com"
  #   target: k8s
  #   k8s:
  #     namespace: default
  #     secret: wildcard-example-com
  #     include_ca: true
  #     labels:
  #       vaultls.io/replicate: "true"
