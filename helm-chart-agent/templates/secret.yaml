{{- if not .Values.vaultls.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultls-agent.credentialsSecret" . }}
  labels:
    {{- include "vaultls-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  client_id: {{ required "vaultls.clientId is required (or set vaultls.existingSecret)" .Values.vaultls.clientId | quote }}
  secret: {{ required "vaultls.secret is required (or set vaultls.existingSecret)" .Values.vaultls.secret | quote }}
{{- end }}
