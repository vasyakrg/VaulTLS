image:
  repository: ghcr.io/vasyakrg/vaultls-agent
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# VaulTLS service account credentials. The chart renders them into a Secret and
# passes the secret through the VAULTLS_SECRET env var, which config.yaml
# expands — the value never appears in the ConfigMap.
vaultls:
  url: https://vaultls.example.com
  clientId: ""
  secret: ""
  insecureSkipVerify: false
  # Use a Secret you manage yourself instead of the one rendered from the values
  # above. It must hold the keys client_id and secret.
  existingSecret: ""

# Cron expression for the reconcile loop, plus a random delay on top of it.
schedule: "0 3 * * *"
jitter: 30m

log:
  level: info
  format: json

# Certificates to keep in sync. Every entry writes one kubernetes.io/tls Secret.
# The labels are what a Kyverno (or reflector) policy selects on to replicate
# the Secret into other namespaces.
certificates:
  - name: "*.example.com"
    # certId: 42          # pin an exact certificate instead of matching by name
    namespace: default
    secretName: wildcard-example-com
    includeCA: true
    labels:
      vaultls.io/replicate: "true"

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

metrics:
  enabled: true
  port: 9105
  serviceMonitor:
    enabled: false
    interval: 60s
    labels: {}
  # Alert rules built on the metrics the agent actually exports in Kubernetes
  # mode. Trust-store and self-update metrics are not covered: the container
  # runs with --no-self-update and writes Secrets, not a host trust store.
  prometheusRule:
    enabled: false
    # Render into another namespace than the release (some setups keep all
    # rules next to Prometheus). Empty = release namespace.
    namespace: ""
    # Selector labels your Prometheus picks rules up by,
    # e.g. release: kube-prometheus-stack
    labels: {}
    interval: ""
    alerts:
      # Fires on the scrape's `up` series, so it needs serviceMonitor.enabled.
      down:
        enabled: true
        for: 10m
        severity: critical
      certExpiry:
        enabled: true
        warningDays: 21
        criticalDays: 7
        for: 1h
      certExpired:
        enabled: true
        for: 5m
        severity: critical
      # No successful reconcile check within this window. Keep it above one
      # `schedule` period plus `jitter`.
      stale:
        enabled: true
        afterHours: 26
        for: 30m
        severity: warning
      reconcileErrors:
        enabled: true
        window: 1h
        for: 15m
        severity: warning
      authErrors:
        enabled: true
        window: 1h
        for: 15m
        severity: critical
      # No certificate series at all: config not applied or every entry fails.
      missingCerts:
        enabled: true
        for: 15m
        severity: warning
    # Appended verbatim to the rule group.
    extraRules: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
